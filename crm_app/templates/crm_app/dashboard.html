<!DOCTYPE html>
<html>
<head>
    <title>Hose CRM Analytics</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-light">
    <div class="container mt-5">
        <h2 class="text-center mb-4">📊 Hose CRM Sales Analysis</h2>
        
        <div class="row">
            <div class="col-md-6 mb-4">
                <div class="card shadow-sm p-3 h-100">
                    <h5 class="text-center">Sold vs Lost Sales</h5>
                    <canvas id="statusChart"></canvas>
                </div>
            </div>

            <div class="col-md-6 mb-4">
                <div class="card shadow-sm p-3 h-100">
                    <h5 class="text-center text-danger">Lost Sale Reasons</h5>
                    <canvas id="lostReasonChart"></canvas>
                </div>
            </div>
        </div>

        <div class="text-center mt-3">
            <a href="/admin/crm_app/hoserecord/" class="btn btn-dark">Back to Record Entry</a>
        </div>
    </div>

    <script>
        // 1. የሁኔታዎች (Status) ዳታ ማዘጋጀት
        const statusCtx = document.getElementById('statusChart').getContext('2d');
        new Chart(statusCtx, {
            type: 'pie',
            data: {
                labels: [{% for s in stats %}'{{ s.status }}',{% endfor %}],
                datasets: [{
                    data: [{% for s in stats %}{{ s.total }},{% endfor %}],
                    backgroundColor: ['#28a745', '#dc3545']
                }]
            }
        });

        // 2. የጠፋ ሽያጭ ምክንያቶች ዳታ ማዘጋጀት
        const lostCtx = document.getElementById('lostReasonChart').getContext('2d');
        new Chart(lostCtx, {
            type: 'bar',
            data: {
                labels: [{% for r in lost_reasons %}'{{ r.lost_reason }}',{% endfor %}],
                datasets: [{
                    label: 'Number of Occurrences',
                    data: [{% for r in lost_reasons %}{{ r.total }},{% endfor %}],
                    backgroundColor: '#ffc107'
                }]
            },
            options: { scales: { y: { beginAtZero: true } } }
        });
    </script>
</body>
</html>
